name: Ukentlig innholdsjobb

# Henter nye/reviderte SSB-data, lager og kontrollerer spørsmålskandidater, planlegger runder
# og skriver en produksjonsrapport. Krever hemmelighetene DATABASE_URL og (valgfritt) ANTHROPIC_API_KEY.
on:
  schedule:
    - cron: "17 4 * * 1" # mandager 04:17 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Hent og analyser alle tabeller på nytt"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: weekly-content
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: npm run pipeline:weekly -- ${{ inputs.force && '--force' || '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: produksjonsrapport
          path: reports/
          retention-days: 90
